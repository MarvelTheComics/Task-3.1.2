<!DOCTYPE html>
<html lang="en" xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>

<table border="1">
    <tr>
        <th>ID</th>
        <th>Имя</th>
        <th>Фамилия</th>
        <th>Возраст</th>
        <th>Цвет глаз</th>
    </tr>
    <tr>
        <td th:text="${user.id}"></td>
        <td th:text="${user.name}"></td>
        <td th:text="${user.secondName}"></td>
        <td th:text="${user.age}"></td>
        <td th:text="${user.eyeColor}"></td>
    </tr>
</table>
<br>
<form th:method="POST" th:action="@{/admin/edit}" th:object="${user}">
    <input type="hidden" th:field="*{id}">
    <input type="hidden" th:field="*{userName}">
    <input type="text" th:field="*{name}" id="name">
    <label for="name">Имя</label>
    <br>
    <input type="text" th:field="*{secondName}" id="secondName">
    <label for="secondName">Фамилия</label>
    <br>
    <input type="text" th:field="*{age}" id="age">
    <label for="age">Возраст</label>
    <br>
    <input type="text" th:field="*{eyeColor}" id="eyeColor">
    <label for="eyeColor">Цвет глаз</label>
    <br>
    <input type="hidden" th:field="*{password}">
    <input type="submit" value="Изменить">
</form>

<form th:action="@{/logout}" method="POST">
    <input type="submit" value="Logout" />
</form>

</body>
</html>
